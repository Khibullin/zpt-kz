{% extends 'core/connections/base.html' %}{% block content %}<h1>Заявки в работе</h1><section><form method="get" class="filters"><input name="q" placeholder="Номер заявки или марка" aria-label="Поиск"><select name="result" aria-label="Результат"><option value="">Все результаты</option value="purchased">Покупка подтверждена</option><option value="closed">Закрыта без покупки</option><option value="search_again">Повторный поиск</option></select><button class="secondary">Показать</button></form></section>{% for row in rows %}<article><h2>Заявка №{{ row.req.pk }}</h2><p>{{ row.req.brand }} {{ row.req.model }} · {{ row.req.city }}</p><span class="badge">{{ row.label }}</span><a class="button secondary" href="{% url 'workflow_admin_control' row.req.pk %}">Открыть</a></article>{% endfor %}{% endblock %}
