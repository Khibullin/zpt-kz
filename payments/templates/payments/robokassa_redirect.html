<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <title>Переход к тестовой оплате Robokassa</title>
</head>
<body>
  <p>Переход на тестовую страницу Robokassa Kazakhstan. IsTest=1. Фискализация не передаётся.</p>
  <form id="robokassa-test-form" action="{{ action }}" method="post">
    {% for name, value in fields.items %}
      <input type="hidden" name="{{ name }}" value="{{ value }}">
    {% endfor %}
    <noscript><button type="submit">Продолжить оплату</button></noscript>
  </form>
  <script>
    document.getElementById('robokassa-test-form').submit();
  </script>
</body>
</html>
