name: Omega best buying policy CI

on:
  pull_request:
    paths:
      - 'procurement/omega_policy.py'
      - 'procurement/catalog_paging.py'
      - 'procurement/analysis.py'
      - 'procurement/views.py'
      - 'procurement/opportunities.py'
      - 'procurement/kaspi_identity_worker.py'
      - 'procurement/management/commands/process_price_updates.py'
      - 'procurement/templates/procurement/dashboard.html'
      - 'procurement/test_omega_best_policy.py'
      - '.github/workflows/omega-best-policy-ci.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: omega-best-policy-ci-only
      DEBUG: 'True'
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check --settings=backend.settings_ui_ci
      - run: python manage.py makemigrations procurement --check --dry-run --settings=backend.settings_ui_ci
      - run: python manage.py test procurement.test_omega_best_policy procurement.test_best_filters procurement.test_saved_kaspi_prices --settings=backend.settings_ui_ci --noinput
