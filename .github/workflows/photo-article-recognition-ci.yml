name: Photo Article Recognition CI

on:
  push:
    branches:
      - zpt-mvp-photo-article-recognition

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret-key-for-tests-only
      DEBUG: 'True'
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: node --check static/js/product-assistant-v1.js
      - run: >
          python manage.py test
          catalog.tests.test_product_article_recognition
          catalog.tests.test_product_assistant
          catalog.tests.test_product_seller_phone
          -v 2
