name: Seller Growth Safety CI

on:
  push:
    branches:
      - fix/seller-growth-city-safety-20261009

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret-key-for-tests-only
      DEBUG: 'True'
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver,zpt-kz-backend.onrender.com
      SELLER_FIRST_CIRCLE_GROWTH_ENABLED: 'False'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: >
          python manage.py test
          core.tests.test_seller_growth
          core.tests.test_seller_discovery_package2
          core.tests.test_seller_lead_market
          core.tests.test_seller_discovery_classification
          -v 2
