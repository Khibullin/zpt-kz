name: Seller Request Response CI

on:
  push:
    branches:
      - zpt-mvp-seller-request-response-control

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret-key-for-tests-only
      DEBUG: 'True'
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: >
          python manage.py test
          core.tests.test_seller_request_response_control
          core.tests.test_seller_request_link
          core.tests.test_request_dispatch_waves
          core.tests.test_seller_request_notification_v2
          -v 2
