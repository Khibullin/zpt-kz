name: Seller WhatsApp Recheck Env Probe

on:
  push:
    branches:
      - zpt-recheck-all-seller-whatsapp

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
    steps:
      - run: |
          python - <<'PY'
          import os
          for key in ('DATABASE_URL','SECRET_KEY','BRAVE_SEARCH_API_KEY','GOOGLE_PLACES_API_KEY','RENDER_API_KEY','RENDER_TOKEN'):
              print(f"{key}={'present' if os.environ.get(key) else 'missing'}")
          PY
