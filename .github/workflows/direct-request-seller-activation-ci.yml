name: Direct Request Seller Activation CI

on:
  push:
    branches:
      - feature/direct-request-seller-activation-20261009

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret-key-for-tests-only
      DEBUG: 'True'
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver,zpt-kz-backend.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test core.tests.test_seller_lead_admin_workflow core.tests.test_seller_contact_enrichment -v 2
