name: Kaspi purchase integration safety checks

on:
  push:
    branches: [main]
    paths:
      - 'procurement/kaspi_catalog_api.py'
      - 'procurement/kaspi_card_jobs.py'
      - 'procurement/kaspi_materials.py'
      - 'procurement/kaspi_price_feed.py'
      - 'procurement/kaspi_workspace.py'
      - 'procurement/management/commands/process_price_updates.py'
      - 'procurement/test_kaspi_purchase_bridge.py'
      - 'procurement/kaspi_snapshot_bridge.py'
      - 'procurement/kaspi_identity_worker.py'
      - 'procurement/test_kaspi_source_recovery.py'
      - 'procurement/kaspi_omega_diagnostic.py'
      - 'procurement/test_preserved_supplier_prices.py'
      - 'procurement/views.py'
      - 'procurement/buying_visible.py'
      - 'procurement/test_buying_visible.py'
      - 'procurement/templates/procurement/dashboard.html'
      - 'procurement/test_kaspi_snapshot_bridge.py'
      - 'procurement/templates/procurement/kaspi_pricing.html'
      - 'backend/settings.py'
      - '.github/workflows/kaspi-purchase-bridge-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEBUG: 'True'
      SECRET_KEY: 'isolated-ci-not-production'
      DATABASE_URL: 'sqlite:////tmp/zpt-kaspi-bridge-ci.sqlite3'
      KASPI_API_TOKEN: ''
      KASPI_MERCHANT_ID: ''
      KASPI_PRICE_FEED_CONNECTED: 'False'
      PRICE_UPDATE_WORKER_ENABLED: 'False'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Python syntax
        run: python -m compileall -q procurement/kaspi_catalog_api.py procurement/kaspi_card_jobs.py procurement/kaspi_materials.py procurement/kaspi_price_feed.py procurement/kaspi_workspace.py procurement/kaspi_snapshot_bridge.py procurement/kaspi_identity_worker.py procurement/test_kaspi_source_recovery.py procurement/kaspi_omega_diagnostic.py procurement/test_preserved_supplier_prices.py procurement/test_buying_visible.py procurement/buying_visible.py procurement/test_kaspi_purchase_bridge.py procurement/test_kaspi_snapshot_bridge.py
      - name: Django validation
        run: python manage.py check --settings=backend.settings_ui_ci
      - name: No schema changes
        run: python manage.py makemigrations procurement inventory --check --dry-run --settings=backend.settings_ui_ci
      - name: Isolated safety tests (no production data or Kaspi POST)
        run: python manage.py test procurement.test_kaspi_purchase_bridge procurement.test_kaspi_snapshot_bridge procurement.test_kaspi_source_recovery procurement.test_preserved_supplier_prices procurement.test_buying_visible --settings=backend.settings_ui_ci --noinput --verbosity 2
