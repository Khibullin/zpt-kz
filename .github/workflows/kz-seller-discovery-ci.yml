name: Kazakhstan Seller Discovery CI

on:
  push:
    branches:
      - zpt-seller-discovery-kz-rotation

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret-key-for-tests-only
      DEBUG: 'True'
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: >
          python manage.py test
          core.tests.test_seller_lead_search_rotation
          core.tests.test_seller_discovery_package2
          core.tests.test_seller_contact_enrichment
          core.tests.test_seller_lead_pipeline
          -v 2
