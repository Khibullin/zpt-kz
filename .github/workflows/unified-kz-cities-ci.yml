name: Unified KZ Cities CI

on:
  push:
    branches:
      - feature/unified-kz-cities-and-discovery-20261009

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret-key-for-tests-only
      DEBUG: 'True'
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver,zpt-kz-backend.onrender.com
      SELLER_FIRST_CIRCLE_GROWTH_ENABLED: 'False'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - name: Run city and request tests
        run: >
          python manage.py test
          core.tests.test_kazakhstan_city_registry
          core.tests.test_home_parts_request
          core.tests.test_seller_growth
          core.tests.test_seller_city_identity
          core.tests.test_seller_lead_admin_workflow
          core.tests.test_seller_discovery_package2
          core.tests.test_create_request_result_verification
          service_requests.tests
          service_requests.test_service_seller_auth
          service_requests.test_dispatch_policy
          catalog.tests.test_seller_pickup_address
          control_panel.tests
          -v 2
