name: Accounting finance fast-path

on:
  pull_request:
    paths:
      - 'inventory/views.py'
      - 'inventory/test_finance_fastpath.py'
      - '.github/workflows/accounting-finance-fast-ci.yml'

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: accounting-finance-ci-only
      DEBUG: 'True'
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check --settings=backend.settings_ui_ci
      - run: python manage.py test inventory.test_finance_fastpath inventory.tests.AccountingTests --settings=backend.settings_ui_ci --noinput
