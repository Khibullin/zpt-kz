name: Two-way request connections
on:
  pull_request:
    paths:
      - 'core/**'
      - 'backend/**'
      - 'templates/request-parts/cabinet/**'
      - 'static/js/request-parts-cabinet.js'
      - '.github/workflows/two-way-request-connections.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEBUG: 'True'
      SECRET_KEY: 'ci-only-two-way-request-offline-tests'
      DATABASE_URL: 'sqlite:////tmp/two-way-request-tests.sqlite3'
      REQUEST_OWNER_EMAIL_ENABLED: 'False'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: >-
          python manage.py test
          core.tests.test_telegram_auto_publication core.tests.test_seller_response_ranking core.tests.test_approved_workflow core.tests.test_request_connections core.tests.test_connection_admin core.tests.test_request_latency core.tests.test_seller_whatsapp_selection core.tests.test_phone_utils
          core.tests.test_manual_request_processing
          core.tests.test_seller_request_link core.tests.test_buyer_portal
          core.tests.test_manual_seller_dispatch core.tests.test_seller_request_response_control
          core.tests.test_telegram_channel core.tests.test_unified_seller_account
          core.tests.test_seller_request_filters core.tests.test_request_dispatch_waves
          --settings=backend.settings_ui_ci --noinput
  postgres-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: connections
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d connections"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: 'True'
      SECRET_KEY: 'ci-only-two-way-request-postgres-tests'
      DATABASE_URL: 'postgresql://test_user:test_password@localhost:5432/connections'
      REQUEST_OWNER_EMAIL_ENABLED: 'False'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: >-
          python manage.py test
          core.tests.test_telegram_auto_publication core.tests.test_seller_response_ranking core.tests.test_approved_workflow core.tests.test_request_connections core.tests.test_connection_admin core.tests.test_request_latency core.tests.test_seller_whatsapp_selection core.tests.test_phone_utils
          core.tests.test_request_connection_concurrency
          --settings=backend.settings_ui_ci --noinput
  approved-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEBUG: 'True'
      SECRET_KEY: 'ci-only-approved-workflow-ui'
      DATABASE_URL: 'sqlite:////tmp/approved-ui.sqlite3'
      REQUEST_OWNER_EMAIL_ENABLED: 'False'
      ZPT_BROWSER_QA: '1'
      NODE_PATH: '/tmp/zpt-browser-qa/node_modules'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: npm install --prefix /tmp/zpt-browser-qa playwright@1.62.1
      - name: Use installed Chrome or install Chromium
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "ZPT_BROWSER_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            node /tmp/zpt-browser-qa/node_modules/playwright/cli.js install --with-deps chromium
          fi
      - run: python manage.py test core.tests.test_approved_workflow_browser --settings=backend.settings_ui_ci --noinput
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-workflow-desktop-mobile
          path: var/reports/workflow-ui/
