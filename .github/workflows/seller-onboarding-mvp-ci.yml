name: Seller Onboarding MVP CI

on:
  push:
    branches:
      - zpt-mvp-seller-lead-onboarding

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret-key-for-tests-only
      DEBUG: 'True'
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Django checks
        run: python manage.py check

      - name: Migration consistency
        run: python manage.py makemigrations --check --dry-run

      - name: Seller onboarding tests
        run: >
          python manage.py test
          core.tests.test_seller_lead_marketplace_onboarding
          core.tests.test_unified_seller_account
          core.tests.test_seller_lead_admin_workflow
          -v 2
