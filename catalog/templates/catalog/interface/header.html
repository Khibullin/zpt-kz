{% load static interface_ui %}
<a class="skip" href="#main">К содержимому / Мазмұнға өту</a>
<header id="header" class="container">
<div class="topbar"><a class="logo" href="/" aria-label="ZPT.KZ — главная">ZPT.<em>KZ</em></a>
{% if interface_home %}<nav class="toplinks"><a href="/?all=1">Каталог</a><a href="{% url 'platform_contacts' %}">Контакты</a></nav>{% else %}<nav class="toplinks"><a href="{% url 'interface_section' section='choose' %}">{% ui 'clients' %}</a><a href="{% url 'business_gateway' %}">{% ui 'business' %}</a><a href="{% url 'zpt_gid' %}">{% ui 'guide' %}</a></nav>{% endif %}
<div class="header-tools"><label class="plain">{% ui_icon 'pin' %}<select id="interface-city" class="city-select" aria-label="Город"><option value="">Весь Казахстан</option>{% for city in kz_cities %}<option value="{{ city }}">{{ city }}</option>{% endfor %}</select></label><button class="plain" type="button" data-zpt-language aria-label="Сменить язык / Тілді өзгерту">RU / KZ</button><a class="plain" href="{% url 'interface_section' section='account' %}" aria-label="Кабинет">{% ui_icon 'user' %}<span class="user-label">{% ui 'account' %}</span></a><a class="plain header-cart" href="{% url 'orders:cart' %}" aria-label="Корзина">{% ui 'cart' %}</a></div></div>
{% if not hide_product_search %}<form class="search site-product-search" action="/" method="get"><label class="searchbox">{% ui_icon 'search' %}<input name="q" type="search" required maxlength="200" aria-label="Поиск запчасти" placeholder="Артикул или название запчасти" data-placeholder-ru="Артикул или название запчасти" data-placeholder-kk="Артикул немесе бөлшек атауы"></label><button class="btn" type="submit">{% ui 'find' %}</button></form>{% endif %}
</header>
