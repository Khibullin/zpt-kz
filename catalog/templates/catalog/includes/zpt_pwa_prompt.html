<div
  class="zpt-pwa-prompt"
  id="zpt-pwa-home-prompt"
  data-zpt-pwa="home-success"
  hidden
>
  <button type="button" class="zpt-pwa-prompt-close" data-zpt-pwa-dismiss aria-label="Закрыть">×</button>
  <p class="zpt-pwa-prompt-title">Добавьте ZPT на главный экран</p>
  <p class="zpt-pwa-prompt-text">Чтобы в следующий раз открыть сервис одним нажатием.</p>
  <div class="zpt-pwa-prompt-actions">
    <button type="button" class="zpt-pwa-prompt-add" data-zpt-pwa-add>Добавить</button>
    <button type="button" class="zpt-pwa-prompt-later" data-zpt-pwa-dismiss>Позже</button>
  </div>
  <p class="zpt-pwa-prompt-instructions" data-zpt-pwa-instructions hidden></p>
</div>
