{% load static %}
<header class="market-topbar header site-header">
  <div class="market-topbar-inner topbar-inner header-inner market-header-flex site-container">

    <div class="market-brand-block">
    {% include 'includes/site_logo.html' with show_subtitle=True subtitle='Автозапчасти' %}
    </div>

    <div class="market-topbar-actions market-header-actions">
      <a href="/" class="market-guide-link no-underline">Каталог запчастей</a>
      <a href="{% url 'zpt_gid' %}" class="market-guide-link no-underline">ZPT Гид</a>

      <a href="{% url 'orders:cart' %}" class="market-cart-link no-underline" title="Корзина">
        <span class="market-cart-icon" aria-hidden="true"></span>
        <span class="market-cart-label">Корзина</span>
        <span class="market-cart-badge" data-cart-count {% if not cart_count %}hidden{% endif %}>
          {{ cart_count|default:0 }}
        </span>
      </a>

      <a href="{% url 'interface_section' section='account' %}" class="market-mobile-business-btn no-underline" aria-label="Кабинет" title="Кабинет">
        <span class="market-mobile-business-icon" aria-hidden="true"></span>
        <span class="market-mobile-business-text">Вход</span>
      </a>

      <a href="{% url 'interface_section' section='account' %}" class="seller-cabinet-btn market-header-cabinet market-header-cabinet--desktop no-underline">
        <span class="seller-cabinet-label">Кабинет</span>
      </a>
    </div>

    {% include 'includes/product_search_form.html' %}

  </div>
</header>
