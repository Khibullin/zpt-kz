services:
  - type: web
    name: zpt-kz-backend
    runtime: python
    buildCommand: bash build.sh
    startCommand: gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: 3.12.8

  # zpt-kz-dispatch-worker cron is managed manually in Render Dashboard (schedule: * * * * *).
  # Do not add a cron service here — Blueprint would create a duplicate worker.
  #
  # Marketing LIVE processor (after deploy, add manually in Render Dashboard):
  #   Name: zpt-kz-marketing-live-processor
  #   Type: Cron Job
  #   Schedule: * * * * *
  #   Command: python manage.py process_marketing_live_sends
  #   Note: safe while MARKETING_WHATSAPP_SEND_MODE=OFF (command exits immediately).
